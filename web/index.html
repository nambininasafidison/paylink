<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PayLink on Arc</title>
<meta name="description" content="Create a USDC payment link on Arc in one click. Share it. Get paid in under a second, straight to your wallet.">
<style>
:root { --bg:#f5f7fb; --card:#fff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --brand:#2563eb; --brand-ink:#fff; --ok:#059669; --bad:#dc2626; --soft:#eef2ff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0b1020; --card:#131a2e; --ink:#e5e7eb; --muted:#9ca3af; --line:#24304d; --brand:#60a5fa; --brand-ink:#0b1020; --ok:#34d399; --bad:#f87171; --soft:#1b2542; } }
:root[data-theme="dark"] { --bg:#0b1020; --card:#131a2e; --ink:#e5e7eb; --muted:#9ca3af; --line:#24304d; --brand:#60a5fa; --brand-ink:#0b1020; --ok:#34d399; --bad:#f87171; --soft:#1b2542; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
.wrap { max-width:600px; margin:0 auto; padding:16px; }
header { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
h1 { margin:0; font-size:1.4rem; } h1 small { color:var(--muted); font-weight:500; font-size:.85rem; }
.card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; margin-top:16px; }
h2 { margin:0 0 12px; font-size:1.15rem; }
label { display:block; font-weight:600; font-size:.9rem; margin:12px 0 4px; }
input { width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); font-size:1rem; }
button { font:inherit; cursor:pointer; border-radius:10px; padding:11px 16px; font-weight:600; border:1px solid var(--brand); background:var(--brand); color:var(--brand-ink); }
button.ghost { background:transparent; color:var(--brand); }
button:disabled { opacity:.5; cursor:default; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:16px; }
.muted { color:var(--muted); font-size:.9rem; }
.amount { font-size:2.2rem; font-weight:800; margin:4px 0; }
.pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:.8rem; font-weight:700; }
.pill.open { background:var(--soft); color:var(--brand); } .pill.paid { background:var(--ok); color:#fff; } .pill.closed { background:var(--line); color:var(--muted); }
.share { display:flex; gap:8px; margin-top:12px; } .share input { font-size:.85rem; }
.status { margin-top:12px; font-size:.9rem; word-break:break-word; } .status.err { color:var(--bad); } .status.ok { color:var(--ok); }
.tabs { display:flex; gap:4px; margin-top:12px; border-bottom:1px solid var(--line); }
.tabs button { background:none; border:0; border-bottom:3px solid transparent; color:var(--muted); border-radius:0; padding:8px 12px; }
.tabs button.active { color:var(--brand); border-bottom-color:var(--brand); }
ul.links { list-style:none; padding:0; margin:0; } ul.links li { padding:10px 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
a { color:var(--brand); } code { font-size:.85em; word-break:break-all; }
.qr { width:200px; margin-top:12px; background:#fff; padding:6px; border-radius:12px; } .qr svg { display:block; width:100%; height:auto; }
.banner { background:var(--soft); border-radius:12px; padding:10px 14px; font-size:.9rem; margin-top:12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⚡ PayLink <small>on Arc</small></h1>
    <button id="connect" class="ghost">Connect wallet</button>
  </header>
  <p class="muted">Create a USDC payment link, share it, and get paid in under a second, straight to your wallet. No sign-up and no platform fee. On Arc, gas is paid in USDC too.</p>
  <div id="banner"></div>
  <nav class="tabs" id="tabs"></nav>
  <main id="main"></main>
  <p class="muted" style="margin-top:24px">Contract: <span id="contract"></span></p>
</div>
<script src="ethers.umd.min.js"></script>
<script src="qrcode.js"></script>
<script src="abi.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
