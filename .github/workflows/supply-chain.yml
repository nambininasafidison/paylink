# SPDX-License-Identifier: MIT
# Supply-chain gate (PAYLINK-V2-SPEC §4.1 "Supply chain", §4.5 workflow hardening; THREAT_MODEL T-17):
# - gitleaks (version and sha256 in scripts/toolchain/pins.env) over the whole git history with .gitleaks.toml: no
#   private key, token or secret is ever committed;
# - the production dependency audit of the v2 workspace, split by importer so the frozen v1 app's tooling advisories
#   are reported without gating (scripts/toolchain/audit-workspace.py --prod --audit-level high).
# Runs on every push to main and pull request, weekly (advisories published since the last push) and on demand. Every
# action is pinned by commit SHA, the token can only read, no secret is used, and pull_request_target is never used.
name: supply-chain

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: gitleaks (every commit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Load the tool pins (scripts/toolchain/pins.env)
        run: grep -E '^PAYLINK_[A-Z0-9_]+=' scripts/toolchain/pins.env >> "$GITHUB_ENV"
      - name: Install gitleaks (checksum verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" "$PAYLINK_GITLEAKS_LINUX_X64_URL"
          echo "${PAYLINK_GITLEAKS_LINUX_X64_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan the history
        run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --config .gitleaks.toml --exit-code 1 .

  audit:
    name: dependency audit (v2, production, high and above)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Load the tool pins (scripts/toolchain/pins.env)
        run: grep -E '^PAYLINK_[A-Z0-9_]+=' scripts/toolchain/pins.env >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788 # v6.0.6
        with:
          version: ${{ env.PAYLINK_PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.PAYLINK_NODE_VERSION }}
      - name: pnpm audit, split by importer
        run: python3 scripts/toolchain/audit-workspace.py --prod --audit-level high
