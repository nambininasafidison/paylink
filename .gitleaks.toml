# gitleaks 8.28.0 configuration (THREAT_MODEL T-17, CONTRIBUTING "Supply chain"; workflow .github/workflows/supply-chain.yml).
#
# Rule: no private key, token or secret is ever committed. The default rules apply in full; the allowlist below names only
# values that are public by construction, each with the reason. Never widen it to silence a real finding: rotate the
# secret, remove it from history and say so in the pull request.
title = "PayLink gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Public test material and public identifiers, never secrets"
regexTarget = "secret"
regexes = [
  # EIP-55 addresses (20 bytes): public by definition.
  '''^0x[0-9a-fA-F]{40}$''',
  # anvil's public default accounts 0 to 9 (mnemonic "test test test test test test test test test test test junk"):
  # published by Foundry, funded on no real chain, used by tests, fixtures and the e2e relayer only.
  '''^0x(ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80|59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d|5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a|7c852118294e51e653712a81e05800f419141751be58f605c371e15141b007a6|47e179ec197488593b187f80a00eb0da91f1b9d0b13f8733639f19c30a34926a|8b3a350cf5c34c9194ca85829a2df0ec3153be0318b5e2d3348e872092edffba|92db14e403b83dfe3df233f83dfa3a0d7096f21ca9b0d6d6b8d88b2b4ec1564e|4bbbf85ce3377467afe5d46f804f221813b2bb87f24d81f60f1fcdbf7cbf4356|dbda1821b80551c9d65939329250298aa3472ba22feea921c0cf5d620ea67b97|2a871d0798f97d79848a013d4936a73bf4cc922c825d33c1cf7073dff6d409c6)$''',
]

[[allowlists]]
description = "Files whose 32-byte values are documented test vectors, EIP-712 digests or vendored public constants"
paths = [
  # Golden vectors: every key is derived from a public label (GoldenVectors.t.sol: privateKey = keccak256(label) mod (n - 1) + 1),
  # every other 32-byte value is a digest, a nonce or a domain separator.
  '''^protocol/test/vectors/[^/]+\.json$''',
  '''^protocol/test/vectors/SpecExamples\.t\.sol$''',
  # The invoice specification's worked examples (invoice keys are EIP-712 digests, not secrets) and their test.
  '''^docs/spec/paylink-invoice-v2\.(md|schema\.json)$''',
  '''^packages/sdk/test/spec-examples\.test\.ts$''',
  # The frozen v1 app's vendored ethers 6 bundle: its public default provider keys (byte-identical since 31a4fdd).
  '''^web/ethers\.umd\.min\.js$''',
]
